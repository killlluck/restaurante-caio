services:
  app:
    image: killlluck/restaurante-caio:staging
    container_name: restauranteCaio
    ports:
      - "8091:3000"
    environment:
      DB_HOST: mysql-infra
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: password
      DB_NAME: restauranteCaio
    networks:
      - rede_alunos
networks:
  rede_alunos:
    external: true
