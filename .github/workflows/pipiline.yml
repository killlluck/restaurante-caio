name: integracao continua e staging

on:
  push:
    branches: ["staging"]

jobs:
  estagio_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js 18
        uses: actions/setup-node@v6
        with:
          node-version: "18"

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxe de todos os arquivos JS
        run: |
          find . -type f -name "*.js" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            ! -path "./dist/*" \
            -exec node --check {} \;

  estagio_lint:
    runs-on: ubuntu-latest
    needs: estagio_build
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js 18
        uses: actions/setup-node@v6
        with:
          node-version: "18"

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar ESLint temporario
        run: npm install --no-save eslint

      - name: Rodar lint
        run: npx eslint .

  job_sonar:
    needs: estagio_lint
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Criar sonar-project.properties dinamico
        run: |
          echo "sonar.projectKey=${{ github.event.repository.name }}" > sonar-project.properties
          echo "sonar.projectName=${{ github.event.repository.name }}" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties
          echo "sonar.inclusions=**/*.js" >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties

      - name: Exibir configuracao do Sonar
        run: cat sonar-project.properties

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || secrets.TOKEN_SONAR }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}

  job_release_docker:
    needs: estagio_lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Gerar tags da imagem
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-

      - name: Build e push da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  job_trivy_sonar:
    needs: job_release_docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo para o Sonar
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan de seguranca com Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:staging
          format: json
          output: trivy-results.json
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Converter Trivy para external issues do Sonar
        run: |
          node <<'EOF'
          const fs = require("fs");

          const input = JSON.parse(fs.readFileSync("trivy-results.json", "utf8"));
          const rulesById = new Map();
          const issues = [];
          const severityMap = {
            CRITICAL: { sonar: "CRITICAL", impact: "HIGH" },
            HIGH: { sonar: "MAJOR", impact: "HIGH" },
            MEDIUM: { sonar: "MINOR", impact: "MEDIUM" },
            LOW: { sonar: "INFO", impact: "LOW" },
            UNKNOWN: { sonar: "INFO", impact: "INFO" }
          };

          for (const result of input.Results || []) {
            for (const vulnerability of result.Vulnerabilities || []) {
              const severity = severityMap[vulnerability.Severity] || severityMap.UNKNOWN;
              const ruleId = vulnerability.VulnerabilityID || "TRIVY_UNKNOWN";

              if (!rulesById.has(ruleId)) {
                rulesById.set(ruleId, {
                  id: ruleId,
                  name: vulnerability.Title || ruleId,
                  description: vulnerability.Description || vulnerability.Title || ruleId,
                  engineId: "trivy",
                  cleanCodeAttribute: "TRUSTWORTHY",
                  type: "VULNERABILITY",
                  severity: severity.sonar,
                  impacts: [
                    {
                      softwareQuality: "SECURITY",
                      severity: severity.impact
                    }
                  ]
                });
              }

              issues.push({
                ruleId,
                effortMinutes: 10,
                primaryLocation: {
                  message: `${ruleId} em ${vulnerability.PkgName || result.Target}: ${vulnerability.InstalledVersion || "versao desconhecida"}`,
                  filePath: "Dockerfile",
                  textRange: {
                    startLine: 1
                  }
                }
              });
            }
          }

          fs.writeFileSync(
            "sonar-trivy-issues.json",
            JSON.stringify({ rules: [...rulesById.values()], issues }, null, 2)
          );
          EOF

      - name: Criar sonar-project.properties com Trivy
        run: |
          echo "sonar.projectKey=${{ github.event.repository.name }}" > sonar-project.properties
          echo "sonar.projectName=${{ github.event.repository.name }}" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties
          echo "sonar.inclusions=**/*.js,Dockerfile" >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties
          echo "sonar.externalIssuesReportPaths=sonar-trivy-issues.json" >> sonar-project.properties

      - name: Exibir configuracao do Sonar com Trivy
        run: cat sonar-project.properties

      - name: SonarQube lendo o Trivy
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || secrets.TOKEN_SONAR }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.externalIssuesReportPaths=sonar-trivy-issues.json

  job_deploy_staging:
    needs: job_trivy_sonar
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v6

      - name: Preparar arquivo Compose com o identificador do aluno
        run: |
          cp docker-compose.yml docker-compose-8091.yml

      - name: Copiar Compose para a EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "docker-compose-8091.yml"
          target: "/home/${{ secrets.EC2_USER }}/deploy_8091"

      - name: Executar o deploy na EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/deploy_8091
            docker compose -f docker-compose-8091.yml pull
            docker compose -f docker-compose-8091.yml up -d
            echo "Deploy do aluno 8091 finalizado com sucesso!"
